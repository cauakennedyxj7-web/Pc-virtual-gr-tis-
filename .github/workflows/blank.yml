# Nome da VM
$VMName = "MinhaVM"

# Criar VM com 4 GB de RAM
New-VM -Name $VMName `
    -Generation 2 `
    -MemoryStartupBytes 4GB `
    -NewVHDPath "C:\VMs\MinhaVM.vhdx" `
    -NewVHDSizeBytes 80GB `
    -SwitchName "Default Switch"

# Configurar processador
Set-VMProcessor -VMName $VMName -Count 4

# Desativar memória dinâmica
Set-VMMemory -VMName $VMName `
    -DynamicMemoryEnabled $false

# Montar a ISO do Windows
Set-VMDvdDrive -VMName $VMName `
    -Path "C:\ISO\Windows.iso"

# Iniciar a VM
Start-VM -Name $VMName
